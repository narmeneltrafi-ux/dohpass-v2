<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DOHPass — Practice questions for the DOH Specialist and GP exams</title>
    <meta name="description" content="Practice questions for the DOH Internal Medicine Specialist and GP licensing exams, each with an explanation of every option. Try sample questions free." />
    <meta name="theme-color" content="#0F1215" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DOHPass" />
    <meta property="og:title" content="DOHPass — Practice questions for the DOH Specialist and GP exams" />
    <meta property="og:description" content="Single-best-answer practice questions for the DOH Specialist and GP licensing exams, explained option by option. Try sample questions free." />
    <meta property="og:url" content="https://www.dohpass.com/" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Only the Latin face is needed for first paint; other subsets load on demand. -->
    <link rel="preload" href="/fonts/plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Every page talks to Supabase on load; open the connection early. -->
    <link rel="preconnect" href="https://qvzvdwvyihwwiqlhgogq.supabase.co" crossorigin />
    <!-- A visitor who isn't signed in and lands on /specialist or /gp waits for
         the free preview questions before anything useful shows. Ask for them
         now, while the app's JavaScript is still downloading, instead of after
         it has run. The quiz page takes the response from window.__dpPreview
         (fetchPreviewQuestions in src/lib/supabase.js) and makes its own
         request if this one is missing or failed. A plain GET with the public
         key in the query string carries no custom headers, so the browser
         sends it without a CORS preflight. Signed-in visitors are skipped:
         they get the trial or the full bank. The 3 and 'dohpass_anon_trial'
         mirror ANON_LIMIT and ANON_KEY in the quiz pages. -->
    <script>
      (function () {
        try {
          var m = location.pathname.match(/^\/(specialist|gp)\/?$/);
          var base = '%VITE_SUPABASE_URL%'.replace(/\/+$/, '');
          if (!m || base.indexOf('https://') !== 0) return;
          if (localStorage.getItem('sb-' + new URL(base).hostname.split('.')[0] + '-auth-token')) return;
          var used = parseInt(localStorage.getItem('dohpass_anon_trial') || '0', 10);
          var limit = 3 - (used > 0 ? used : 0);
          if (limit <= 0) return;
          window.__dpPreview = {
            track: m[1],
            limit: limit,
            promise: fetch(base + '/rest/v1/rpc/get_preview_questions?p_track=' + m[1] +
                '&p_limit=' + limit + '&apikey=' + encodeURIComponent('%VITE_SUPABASE_ANON_KEY%'))
              .then(function (r) { return r.ok ? r.json() : null; })
              .catch(function () { return null; })
          };
        } catch (e) { /* storage blocked or an old browser: the page fetches as usual */ }
      })();
    </script>
    <!-- Google Ads global site tag. The gtag() stub and config run immediately,
         so page views and conversions queue in dataLayer from the first moment;
         the library itself (the largest main-thread cost on the page) loads
         after the page has finished loading and is idle. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-18224272403');
      (function () {
        function loadGtag() {
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=AW-18224272403';
          document.head.appendChild(s);
        }
        function whenIdle() {
          if ('requestIdleCallback' in window) requestIdleCallback(loadGtag, { timeout: 3000 });
          else setTimeout(loadGtag, 1500);
        }
        if (document.readyState === 'complete') whenIdle();
        else window.addEventListener('load', whenIdle, { once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
